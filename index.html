<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carian Restoran Halal JAKIM (Kota Kinabalu)</title>
  
  <!-- Leaflet CSS CDN -->
  <link rel="stylesheet" href="[suspicious link removed]" />
  <!-- Fail CSS Tempatan -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app">
    <header>
      <h1>Peta Restoran Halal JAKIM (Kota Kinabalu)</h1>
    </header>

    <div id="controls">
      <button class="btn-search" onclick="cariRestoranBerhampiran()">🎯 Kesan Lokasi Saya (GPS)</button>

      <div class="filter-group">
        <input type="text" id="searchInput" class="input-box" placeholder="🔍 Taip nama restoran..." oninput="applyFilters()" />
        
        <select id="radiusSelect" class="select-box" onchange="applyFilters()">
          <option value="5">Radius 5 KM</option>
          <option value="10">Radius 10 KM</option>
          <option value="25">Radius 25 KM</option>
          <option value="999" selected>Semua Jarak (Tunjuk Semua)</option>
        </select>
      </div>

      <div id="status">Memuatkan peta Kota Kinabalu...</div>
    </div>

    <div id="map"></div>
  </div>

  <!-- Leaflet JS CDN -->
  <script src="[suspicious link removed]"></script>
  <!-- Fail JavaScript Tempatan -->
  <script src="script.js"></script>
</body>
</html>
