<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta Restoran Halal (Kota Kinabalu)</title>
  
  <!-- Leaflet CSS CDN -->
  <link rel="stylesheet" href="[suspicious link removed]" />
  <!-- Fail CSS Locator -->
  <link rel="stylesheet" href="locator.css" />
</head>
<body>

  <div class="container">
    <header>
      <h1>Peta Restoran Halal (Kota Kinabalu)</h1>
      <p id="statusText">Memuatkan maklumat restoran halal berhampiran...</p>
    </header>

    <!-- Top Controls Bar -->
    <div class="top-bar">
      <div class="controls-left">
        <label class="toggle-switch">
          <input type="checkbox" id="openNowToggle" onchange="toggleOpenNow()">
          <span>Buka Sekarang</span>
        </label>
      </div>

      <button class="btn-slate" onclick="locateUserAndFindNearest()">
        🎯 Berhampiran Saya
      </button>
    </div>

    <!-- Main Content: Store List & Map Frame -->
    <div class="main-layout">
      <div class="store-list-container" id="storeList">
        <!-- Kad kedai akan dimasukkan secara automatik oleh JS -->
      </div>

      <div class="map-frame">
        <div id="map"></div>
      </div>
    </div>
  </div>

  <!-- Leaflet JS CDN -->
  <script src="[suspicious link removed]"></script>
  <!-- Fail JS Locator -->
  <script src="locator.js"></script>
</body>
</html>
